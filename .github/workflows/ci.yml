name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend dependency validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libffi-dev \
            libjpeg-dev \
            libopenjp2-7-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

  postgres-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workspace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libffi-dev \
            libjpeg-dev \
            libopenjp2-7-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Alembic migrations against PostgreSQL
        env:
          FLASK_APP: run.py
          FLASK_CONFIG: development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workspace_ci
          SECRET_KEY: ci-secret-key-for-application-validation
          JWT_SECRET_KEY: ci-jwt-secret-key-for-application-validation
        run: python -m flask db upgrade

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Audit critical frontend vulnerabilities
        run: npm audit --audit-level=critical

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - postgres-migrations
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --target backend -t workspace-backend-ci .

      - name: Build frontend development image
        run: docker build --target frontend-dev -t workspace-frontend-dev-ci .

      - name: Build frontend static image
        run: docker build --target frontend -t workspace-frontend-ci .

      - name: Build App Platform web image
        run: docker build --target web -t workspace-web-ci .

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/COMET
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose -p comet -f docker-compose.prod.yml build
            sudo docker compose -p comet -f docker-compose.prod.yml run --rm --no-deps backend python -m flask db upgrade
            sudo docker compose -p comet -f docker-compose.prod.yml up -d --remove-orphans
            sudo docker compose -p comet -f docker-compose.prod.yml ps
            TARGET_PORT=$(sudo docker compose -p comet -f docker-compose.prod.yml port frontend 80 2>/dev/null | head -n 1 | awk -F: '{print $NF}')
            TARGET_PORT="${TARGET_PORT:-3000}"
            echo "Awaiting production health check on port ${TARGET_PORT}..."
            for i in $(seq 1 30); do
              HEALTH_API=$(curl -fsS "http://127.0.0.1:${TARGET_PORT}/api/health" 2>/dev/null || true)
              ROOT_HTML=$(curl -fsS "http://127.0.0.1:${TARGET_PORT}/" 2>/dev/null || true)
              if echo "$HEALTH_API" | grep -q '"status":"ok"' && \
                 [ -n "$ROOT_HTML" ] && \
                 ! echo "$ROOT_HTML" | grep -q "@vite/client"; then
                echo "Production health check passed on port ${TARGET_PORT} (API ok, Nginx production SPA active)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Production health check failed after 60 seconds on port ${TARGET_PORT}"
                exit 1
              fi
              sleep 2
            done

