      - DOCUMENT_LANGUAGE_TOOL_MIN_CONFIDENCE=${DOCUMENT_LANGUAGE_TOOL_MIN_CONFIDENCE:-0.6}
      - DOCUMENT_LANGUAGE_TOOL_IGNORE_TERMS=${DOCUMENT_LANGUAGE_TOOL_IGNORE_TERMS:-NADAI,LGSF,FALGU,DILG,LGU,FY,GAA,NCA,NTA,SubayBAYAN}
      - DOCUMENT_AWS_ENABLED=${DOCUMENT_AWS_ENABLED:-false}
      - DOCUMENT_AWS_REGION=${DOCUMENT_AWS_REGION:-ap-southeast-1}
      - DOCUMENT_AWS_PROFILE_NAME=${DOCUMENT_AWS_PROFILE_NAME:-}
      - DOCUMENT_AWS_MAX_SYNC_BYTES=${DOCUMENT_AWS_MAX_SYNC_BYTES:-10485760}
      - DOCUMENT_AWS_TEXTRACT_ENABLED=${DOCUMENT_AWS_TEXTRACT_ENABLED:-true}
      - DOCUMENT_AWS_REKOGNITION_ENABLED=${DOCUMENT_AWS_REKOGNITION_ENABLED:-true}
      - DOCUMENT_AWS_TEXTRACT_FEATURE_TYPES=${DOCUMENT_AWS_TEXTRACT_FEATURE_TYPES:-TABLES,FORMS,SIGNATURES,LAYOUT}
      - DOCUMENT_AWS_REKOGNITION_MAX_LABELS=${DOCUMENT_AWS_REKOGNITION_MAX_LABELS:-20}
      - DOCUMENT_AWS_REKOGNITION_MIN_CONFIDENCE=${DOCUMENT_AWS_REKOGNITION_MIN_CONFIDENCE:-70}
      - DOCUMENT_AWS_LOCATION_ENABLED=${DOCUMENT_AWS_LOCATION_ENABLED:-false}
      - DOCUMENT_AWS_LOCATION_PLACE_INDEX=${DOCUMENT_AWS_LOCATION_PLACE_INDEX:-}
      - DOCUMENT_AWS_LOCATION_LANGUAGE=${DOCUMENT_AWS_LOCATION_LANGUAGE:-en}
      - DOCUMENT_AWS_CONNECT_TIMEOUT_SECONDS=${DOCUMENT_AWS_CONNECT_TIMEOUT_SECONDS:-5}
      - DOCUMENT_AWS_READ_TIMEOUT_SECONDS=${DOCUMENT_AWS_READ_TIMEOUT_SECONDS:-20}
      - DOCUMENT_AWS_MAX_ATTEMPTS=${DOCUMENT_AWS_MAX_ATTEMPTS:-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-DILG Operations Workspace}
      - GOOGLE_DRIVE_ENABLED=${GOOGLE_DRIVE_ENABLED:-true}
      - GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=${GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE}
      - GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON=${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON}
      - GOOGLE_DRIVE_ROOT_FOLDER_ID=${GOOGLE_DRIVE_ROOT_FOLDER_ID}
      - GOOGLE_DRIVE_SHARED_DRIVE_ID=${GOOGLE_DRIVE_SHARED_DRIVE_ID}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_DRIVE_OAUTH_REDIRECT_URI=${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:-http://localhost:5000/api/drive/oauth/callback}
      - SYSTEM_CONFIG_SECRET_KEY=${SYSTEM_CONFIG_SECRET_KEY:-comet-local-system-config-secret-change-before-production}
    volumes:
      - ./backend:/app
      - ./document_fixture_generator:/app/document_fixture_generator:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  languagetool:
    image: collabora/languagetool:latest
    profiles:
      - language-tools
    ports:
      - "8081:8010"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  postgres_data:
