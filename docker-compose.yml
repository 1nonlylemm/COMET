services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workspace_db
    ports:
      - "${COMET_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workspace_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  backend:
    image: comet-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - FLASK_CONFIG=development
      - SECRET_KEY=${SECRET_KEY:-comet-local-flask-secret-change-before-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-comet-local-jwt-secret-change-before-production}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/${COMET_DEMO_DATABASE_NAME:-workspace_db}
      - COMET_DEMO_DATABASE_NAME=${COMET_DEMO_DATABASE_NAME:-workspace_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - APP_LOGIN_URL=${APP_LOGIN_URL}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:3000}
      - ENABLE_PUBLIC_MAGIC_LINKS=${ENABLE_PUBLIC_MAGIC_LINKS:-false}
      - APP_NAME=${APP_NAME:-DILG Operations Workspace}
      - APP_TAGLINE=${APP_TAGLINE:-DILG Laguna PDMU Operations System}
      - SUBMISSION_UPLOAD_DIR=${SUBMISSION_UPLOAD_DIR:-/app/uploads/submissions}
      - GUIDELINE_UPLOAD_DIR=${GUIDELINE_UPLOAD_DIR:-/app/uploads/guidelines}
      - IMPORT_UPLOAD_DIR=${IMPORT_UPLOAD_DIR:-/app/uploads/imports}
      - BRANDING_UPLOAD_DIR=${BRANDING_UPLOAD_DIR:-/app/uploads/branding}
      - REPORT_TEMPLATE_UPLOAD_DIR=${REPORT_TEMPLATE_UPLOAD_DIR:-/app/uploads/report_templates}
      - OBJECT_STORAGE_PROVIDER=${OBJECT_STORAGE_PROVIDER:-local}
      - OBJECT_STORAGE_ENV=${OBJECT_STORAGE_ENV:-local}
      - OBJECT_STORAGE_BUCKET_PREFIX=${OBJECT_STORAGE_BUCKET_PREFIX:-comet}
      - OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS=${OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS:-300}
      - OBJECT_STORAGE_TEMP_DIR=${OBJECT_STORAGE_TEMP_DIR:-/app/instance/storage_tmp}
      - OBJECT_STORAGE_LOCAL_DIR=${OBJECT_STORAGE_LOCAL_DIR:-/app/instance/object_storage}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_REGION=${R2_REGION:-auto}
      - AI_PROVIDER_ORDER=${AI_PROVIDER_ORDER:-gemini,groq,openrouter}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-30}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-1200}
