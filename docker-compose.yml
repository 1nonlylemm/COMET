      - DOCUMENT_LANGUAGE_TOOL_IGNORE_TERMS=${DOCUMENT_LANGUAGE_TOOL_IGNORE_TERMS:-NADAI,LGSF,FALGU,DILG,LGU,FY,GAA,NCA,NTA,SubayBAYAN}
