      - DOCUMENT_AWS_TEXTRACT_FEATURE_TYPES=${DOCUMENT_AWS_TEXTRACT_FEATURE_TYPES:-TABLES,FORMS,SIGNATURES,LAYOUT}
      - DOCUMENT_AWS_REKOGNITION_MAX_LABELS=${DOCUMENT_AWS_REKOGNITION_MAX_LABELS:-20}
      - DOCUMENT_AWS_REKOGNITION_MIN_CONFIDENCE=${DOCUMENT_AWS_REKOGNITION_MIN_CONFIDENCE:-70}
      - DOCUMENT_AWS_LOCATION_ENABLED=${DOCUMENT_AWS_LOCATION_ENABLED:-false}
      - DOCUMENT_AWS_LOCATION_PLACE_INDEX=${DOCUMENT_AWS_LOCATION_PLACE_INDEX:-}
      - DOCUMENT_AWS_LOCATION_LANGUAGE=${DOCUMENT_AWS_LOCATION_LANGUAGE:-en}
