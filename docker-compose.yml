      - SYSTEM_CONFIG_SECRET_KEY=${SYSTEM_CONFIG_SECRET_KEY:-comet-local-system-config-secret-change-before-production}
    volumes:
      - ./backend:/app
      - ./document_fixture_generator:/app/document_fixture_generator:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Use standard flask run for hot reloading in development instead of gunicorn
    command: sh -c "python -m flask db upgrade && python -m flask run --host=0.0.0.0 --port=5000 --reload"
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"

